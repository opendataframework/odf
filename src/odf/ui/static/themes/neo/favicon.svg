<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" shape-rendering="crispEdges">
    <title>odf — neo theme pixel logo</title>

    <!-- frame -->
    <rect x="0" y="0" width="90" height="90" fill="#0a0a0a" />

    <!-- hot-pink field with beveled edges -->
    <rect x="6" y="6" width="78" height="78" fill="#FF2E88" />
    <rect x="6" y="6" width="78" height="6" fill="#FF7AB8" />
    <rect x="6" y="78" width="78" height="6" fill="#C2005B" />
    <rect x="6" y="12" width="6" height="66" fill="#FF7AB8" />
    <rect x="78" y="12" width="6" height="66" fill="#C2005B" />

    <!-- left electric-yellow eye -->
    <rect x="12" y="18" width="24" height="24" fill="#FFE600" />
    <rect x="12" y="18" width="24" height="6" fill="#FFF98A" />
    <rect x="12" y="36" width="24" height="6" fill="#C7A600" />
    <rect x="12" y="24" width="6" height="18" fill="#FFF98A" />
    <rect x="30" y="24" width="6" height="12" fill="#C7A600" />

    <!-- right electric-yellow eye -->
    <rect x="42" y="18" width="24" height="24" fill="#FFE600" />
    <rect x="42" y="18" width="24" height="6" fill="#FFF98A" />
    <rect x="42" y="36" width="24" height="6" fill="#C7A600" />
    <rect x="42" y="24" width="6" height="18" fill="#FFF98A" />
    <rect x="60" y="24" width="6" height="12" fill="#C7A600" />
</svg>
