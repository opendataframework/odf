<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
    <title>odf — clay theme logo</title>

    <defs>
        <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#000" stop-opacity="0.55" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7dcc0" />
            <stop offset="1" stop-color="#e9bf95" />
        </linearGradient>
        <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e2ad7c" />
            <stop offset="1" stop-color="#b98458" />
        </linearGradient>
        <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b07a4f" />
            <stop offset="1" stop-color="#7e5536" />
        </linearGradient>
    </defs>

    <!-- matte graphite tile -->
    <rect x="0" y="0" width="90" height="90" rx="18" fill="#2b2e33" />

    <!-- soft contact shadow, cast down-right -->
    <ellipse cx="49" cy="70" rx="30" ry="11" fill="url(#contact)" />

    <!-- clay cube lit from the top-left: bright top, mid left, dark right -->
    <path d="M45 16 L70 30 L45 44 L20 30 Z" fill="url(#top)" />
    <path d="M20 30 L45 44 L45 72 L20 58 Z" fill="url(#left)" />
    <path d="M70 30 L45 44 L45 72 L70 58 Z" fill="url(#right)" />
</svg>
