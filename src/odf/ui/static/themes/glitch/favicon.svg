<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" shape-rendering="crispEdges">
    <title>odf — glitch theme pixel logo</title>

    <!-- frame -->
    <rect x="0" y="0" width="90" height="90" fill="#0e0e10" />

    <!-- purple field with beveled edges -->
    <rect x="6" y="6" width="78" height="78" fill="#9147FF" />
    <rect x="6" y="6" width="78" height="6" fill="#B490FF" />
    <rect x="6" y="78" width="78" height="6" fill="#6C2FD1" />
    <rect x="6" y="12" width="6" height="66" fill="#B490FF" />
    <rect x="78" y="12" width="6" height="66" fill="#6C2FD1" />

    <!-- left pale eye -->
    <rect x="12" y="18" width="24" height="24" fill="#EFEFF1" />
    <rect x="12" y="18" width="24" height="6" fill="#FFFFFF" />
    <rect x="12" y="36" width="24" height="6" fill="#C8C8CE" />
    <rect x="12" y="24" width="6" height="18" fill="#FFFFFF" />
    <rect x="30" y="24" width="6" height="12" fill="#C8C8CE" />

    <!-- right pale eye -->
    <rect x="42" y="18" width="24" height="24" fill="#EFEFF1" />
    <rect x="42" y="18" width="24" height="6" fill="#FFFFFF" />
    <rect x="42" y="36" width="24" height="6" fill="#C8C8CE" />
    <rect x="42" y="24" width="6" height="18" fill="#FFFFFF" />
    <rect x="60" y="24" width="6" height="12" fill="#C8C8CE" />
</svg>
