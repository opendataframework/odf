<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODF — Topology</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<div id="topbar"></div>

<div id="shell">
<div id="hdr" class="panel">
  <div class="brand">
    <div class="brand-mark" id="brand-mark"></div>
    <span class="hdr-title"><span id="hdr-brand">ODF</span><small id="hdr-subtitle">Topology · loading…</small></span>
  </div>
  <div class="hdr-stats">
    <div class="hdr-stat"><span class="k">Project</span><span class="v" id="stat-project" style="color:var(--title-accent)">—</span></div>
    <div class="hdr-stat"><span class="k">Objects</span><span class="v" id="stat-objects">—</span></div>
    <div class="hdr-stat"><span class="k">Links</span><span class="v" id="stat-links">—</span></div>
    <div class="hdr-stat"><span class="k">Services</span><span class="v" id="stat-services" style="color:var(--accent-service)">—</span></div>
    <div class="hdr-stat"><span class="k">Tasks</span><span class="v" id="stat-tasks" style="color:var(--accent-task)">—</span></div>
    <div class="hdr-stat"><span class="k">Pipelines</span><span class="v" id="stat-pipelines" style="color:var(--accent-pipeline)">—</span></div>
    <div class="hdr-stat"><span class="k">Agents</span><span class="v" id="stat-agents" style="color:var(--accent-agent)">—</span></div>
  </div>
  <div class="hdr-status"><span class="dot"></span>System Nominal</div>
  <div class="hdr-clock mono" id="hdr-clock">--:--:--</div>
  <div class="hdr-actions">
    <button id="activity-toggle" class="hdr-icon-btn" title="Activity log" aria-label="Toggle activity log" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M1.5 8h3l2-5 3 10 2-5h3"/></svg></button>
    <button id="chat-toggle" class="hdr-icon-btn" title="Chat" aria-label="Toggle chat" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M2.5 3h11v8h-6l-3 2.5V11h-2z"/></svg></button>
  </div>
  <button id="theme-toggle" class="theme-toggle" title="Toggle light / dark theme" aria-label="Toggle theme" style="margin-left:10px"></button>
</div>

<div id="body">
  <div id="sidebar" class="panel">
    <div id="sb-rail" role="tablist" aria-orientation="vertical" aria-label="Sidebar">
      <button id="sb-collapse" title="Collapse sidebar" aria-label="Collapse sidebar" aria-controls="sb-panels" aria-expanded="true"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    </div>
    <div id="sb-panels">
      <div class="sb-panel active" id="sb-panel-objects" data-panel="objects" role="tabpanel">
        <div class="sb-section" style="flex:1">
          <div class="sb-heading">Objects <span class="count" id="node-count">00</span></div>
          <div id="node-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="map" class="panel mode-topology">
    <canvas id="canvas"></canvas>
    <div id="map-title">Topology</div>
    <div class="corner-bracket tl"></div>
    <div class="corner-bracket tr"></div>
    <div class="corner-bracket bl"></div>
    <div class="corner-bracket br"></div>
    <div id="coord-readout">CELL <b id="cr-cell">—:—</b> &nbsp;ZOOM <b id="cr-zoom">100%</b></div>
    <div id="type-legend">
      <div class="tl-item" style="color:var(--accent-config)" title="platform"><span class="tl-pip"></span>Config</div>
      <div class="tl-item" style="color:var(--accent-component)" title="warehouse"><span class="tl-pip"></span>@Component</div>
      <div class="tl-item" style="color:var(--accent-repository)" title="server rack"><span class="tl-pip"></span>@Repository</div>
      <div class="tl-item" style="color:var(--accent-service)" title="antenna"><span class="tl-pip"></span>@Service</div>
      <div class="tl-item" style="color:var(--accent-task)" title="factory cube"><span class="tl-pip"></span>@Task</div>
      <div class="tl-item" style="color:var(--accent-pipeline)" title="conveyor"><span class="tl-pip"></span>@Pipeline</div>
    </div>
    <div id="zoom-controls">
      <button id="zoom-in"    title="Zoom in">+</button>
      <button id="zoom-out"   title="Zoom out">&minus;</button>
      <div class="zc-sep"></div>
      <button id="zoom-reset" title="Reset view">&#8962;</button>
    </div>
    <div id="grid-controls">
      <button id="grid-nw" title="Add cells (top-left edge)">&#8598;</button>
      <button id="grid-ne" title="Add cells (top-right edge)">&#8599;</button>
      <button id="grid-sw" title="Add cells (bottom-left edge)">&#8601;</button>
      <button id="grid-se" title="Add cells (bottom-right edge)">&#8600;</button>
    </div>
    <div id="map-panel-view">
      <div class="map-panel-hdr">
        <button id="map-back-btn" class="map-back-btn">&larr; Topology</button>
        <span id="map-panel-title">—</span>
        <div id="map-panel-hdr-extra"></div>
      </div>
      <div id="map-panel-body"></div>
      <div id="media-lightbox" class="media-lightbox" hidden>
        <div id="media-lightbox-stage" class="media-lightbox-stage">
          <button id="media-lightbox-prev" class="data-btn media-lightbox-nav" title="Previous (&larr;)">&lsaquo;</button>
          <img id="media-lightbox-img" alt="" draggable="false">
          <video id="media-lightbox-video" controls playsinline hidden></video>
          <audio id="media-lightbox-audio" controls hidden></audio>
          <div id="media-lightbox-doc" class="doc-reader" hidden></div>
          <div id="media-lightbox-error" class="media-fallback" hidden></div>
          <div id="image-annotations" class="image-annotations" hidden>
            <div id="image-boxes"></div>
            <form id="image-label-form" class="image-label-form" hidden>
              <input id="image-label-input" placeholder="Label, then Enter" autocomplete="off" aria-label="Box label">
              <div id="image-label-options" class="image-label-options" hidden></div>
            </form>
          </div>
          <button id="media-lightbox-next" class="data-btn media-lightbox-nav" title="Next (&rarr;)">&rsaquo;</button>
          <button id="media-lightbox-close" class="media-lightbox-close" title="Close (Esc)" aria-label="Close">&times;</button>
          <div id="media-lightbox-rail" class="media-lightbox-rail" role="toolbar" aria-orientation="vertical" aria-label="Tools">
            <button class="lightbox-tool" data-tool="select" title="Select (V)" aria-label="Select" aria-pressed="false" hidden><svg viewBox="0 0 16 16"><path d="M3.5 2.5 7.6 13l1.5-4.4 4.4-1.5z"/></svg></button>
            <button class="lightbox-tool" data-tool="box" title="Draw a box (B)" aria-label="Draw a box" aria-pressed="false" hidden><svg viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11z"/></svg></button>
            <button class="lightbox-tool" data-tool="fixed" title="Place a fixed-size box (F)" aria-label="Place a fixed-size box" aria-pressed="false" hidden><svg viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9zM8 6v4M6 8h4"/></svg></button>
            <button class="lightbox-tool" data-tool="span" title="Label text (T)" aria-label="Label text" aria-pressed="false" hidden><svg viewBox="0 0 16 16"><path d="M4 3h8M8 3v7M3 13h10"/></svg></button>
            <button class="lightbox-tool" data-tool="range" title="Label a range (R)" aria-label="Label a range" aria-pressed="false" hidden><svg viewBox="0 0 16 16"><path d="M4 2.5v11M12 2.5v11M4 8h8"/></svg></button>
            <button class="lightbox-tool" data-tool="point" title="Label a point (P)" aria-label="Label a point" aria-pressed="false" hidden><svg viewBox="0 0 16 16"><path d="M8 2.5v3.5M8 10v3.5"/><circle cx="8" cy="8" r="2"/></svg></button>
            <div id="media-lightbox-rail-sep" class="media-lightbox-rail-sep" hidden></div>
            <button id="media-lightbox-source" class="lightbox-tool" title="View source" aria-label="View source" aria-pressed="false" hidden><svg viewBox="0 0 16 16"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg></button>
            <a id="media-lightbox-open" class="lightbox-tool" target="_blank" rel="noopener" title="Open original" aria-label="Open original"><svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 8 8M11.5 9.5v4h-9v-9h4"/></svg></a>
            <span id="image-box-size" class="image-box-size" hidden>
              <input id="image-box-width" type="number" min="1" step="1" title="Box width, in image pixels" aria-label="Box width in pixels">
              <span class="image-box-size-x">&times;</span>
              <input id="image-box-height" type="number" min="1" step="1" title="Box height, in image pixels" aria-label="Box height in pixels">
            </span>
          </div>
        </div>
        <div id="media-lightbox-strip" class="clip-strip" hidden>
          <svg id="clip-wave" class="clip-wave" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div id="clip-marks" class="ts-marks"></div>
          <div id="clip-playhead" class="clip-playhead"></div>
        </div>
        <div id="media-lightbox-classes" class="record-classes" hidden></div>
        <div class="media-lightbox-bar">
          <div id="media-lightbox-caption" class="doc-header"></div>
          <span id="media-lightbox-hint" class="media-lightbox-hint" hidden></span>
        </div>
      </div>
    </div>
    <div id="inspector-popup" class="inspector-popup">
      <button id="inspector-popup-close" class="inspector-popup-close" title="Close">&times;</button>
      <div id="inspector-popup-body"></div>
    </div>
    <div id="style-picker-popover" class="style-picker-popover">
      <div class="style-picker-section">
        <div class="style-picker-label">Shape</div>
        <div class="icon-picker-tabs" id="icon-picker-tabs"></div>
        <div class="icon-picker-grid" id="icon-picker-grid"></div>
      </div>
      <div class="style-picker-section">
        <div class="style-picker-label">Color</div>
        <div class="color-picker-grid" id="color-picker-grid"></div>
      </div>
    </div>
    <div id="activity-drawer">
      <div class="activity-drawer-hdr">
        <span class="panel-heading">Activity</span>
        <button id="activity-drawer-close" class="map-back-btn">Close</button>
      </div>
      <div id="log-lines"></div>
    </div>
    <div id="chat-drawer">
      <div class="activity-drawer-hdr">
        <span class="panel-heading">Chat</span>
        <button id="chat-drawer-close" class="map-back-btn">Close</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-footer">
        <div id="chat-mention-menu" class="mention-menu" hidden></div>
        <textarea id="chat-input" placeholder="Ask, or @ a component…"></textarea>
        <button id="chat-send" class="data-btn primary">Send</button>
      </div>
    </div>
  </div>
</div>
</div>

<div id="layer-color-popover" class="style-picker-popover layer-color-popover">
  <div class="style-picker-section">
    <div class="style-picker-label">Layer Color</div>
    <div class="color-picker-grid" id="layer-color-picker-grid"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/app.js"></script>
<script src="/icons/shared.js"></script>
<script src="/icons/devices.js"></script>
<script src="/icons/buildings.js"></script>
<script src="/icons/charts.js"></script>
<script src="/icons/research.js"></script>
<script src="/icons/ml.js"></script>
<script src="/icons/shop.js"></script>
<script src="/theme.js"></script>
</body>
</html>
