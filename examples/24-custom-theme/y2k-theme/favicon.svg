<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
    <title>odf — y2k theme chrome orb logo</title>

    <defs>
        <radialGradient id="orb" cx="0.36" cy="0.3" r="0.75">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.2" stop-color="#dfe6ff" />
            <stop offset="0.55" stop-color="#8d9bd6" />
            <stop offset="1" stop-color="#2a3168" />
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5aa9ff" />
            <stop offset="0.35" stop-color="#b38cff" />
            <stop offset="0.65" stop-color="#ff7ad9" />
            <stop offset="1" stop-color="#3ee8ff" />
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
    </defs>

    <!-- iridescent rim around a chrome orb -->
    <circle cx="45" cy="45" r="41" fill="url(#rim)" />
    <circle cx="45" cy="45" r="35" fill="url(#orb)" />

    <!-- gloss highlight -->
    <ellipse cx="40" cy="26" rx="20" ry="10" fill="url(#gloss)" />
</svg>
