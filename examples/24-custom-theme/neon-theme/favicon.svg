<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- A palm against a banded sun setting into a violet sea. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f5c"/>
      <stop offset="1" stop-color="#ff2fa8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#ff5fa0"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3" fill="url(#sky)"/>
  <circle cx="9" cy="10" r="5" fill="url(#sun)"/>
  <!-- bands across the lower half of the sun -->
  <rect x="3" y="9.6" width="12" height="0.7" fill="#ff2fa8"/>
  <rect x="3" y="11" width="12" height="0.9" fill="#ff2fa8"/>
  <rect y="12.4" width="16" height="3.6" fill="#3a1478"/>
  <rect y="12.4" width="16" height="0.6" fill="#29e6ff"/>
  <!-- the palm -->
  <path d="M4.2 13 C4.6 10 5 7.5 5.6 5.4" stroke="#0d061c" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M5.6 5.4 C4 4.2 2.4 4.6 1.4 6 C2.8 5.2 4 5.2 5.6 5.4Z
           M5.6 5.4 C6.2 3.8 7.8 3.2 9.4 3.8 C7.8 3.9 6.6 4.4 5.6 5.4Z
           M5.6 5.4 C7.4 4.8 9 5.6 9.8 7.2 C8.6 6.2 7.2 5.7 5.6 5.4Z
           M5.6 5.4 C4.8 3.6 3.6 2.8 2.2 2.8 C3.6 3.4 4.6 4.2 5.6 5.4Z" fill="#0d061c"/>
</svg>
