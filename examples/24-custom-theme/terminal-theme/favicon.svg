    <rect x="27" y="33" width="9" height="9" fill="#4dff88" />
    <rect x="36" y="42" width="9" height="6" fill="#4dff88" />
    <rect x="27" y="48" width="9" height="9" fill="#4dff88" />
    <rect x="18" y="57" width="9" height="9" fill="#4dff88" />

