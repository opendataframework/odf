<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
    <title>odf — beacon theme logo</title>

    <!-- dark slate plate -->
    <rect x="0" y="0" width="90" height="90" fill="#0e1217" />

    <!-- city streets -->
    <g stroke="#2a333e" stroke-width="2">
        <path d="M0 30 H90 M0 60 H90 M30 0 V90 M60 0 V90" />
    </g>

    <!-- orange corner ticks -->
    <g fill="none" stroke="#ff6d10" stroke-width="4">
        <path d="M4 18 V4 H18" />
        <path d="M72 86 H86 V72" />
    </g>

    <!-- segmented marker ring -->
    <g fill="none" stroke="#ff6d10" stroke-width="3.5" stroke-linecap="butt">
        <path d="M51.3 23.9 A22 22 0 0 1 66.1 38.7" />
        <path d="M66.1 51.3 A22 22 0 0 1 51.3 66.1" />
        <path d="M38.7 66.1 A22 22 0 0 1 23.9 51.3" />
        <path d="M23.9 38.7 A22 22 0 0 1 38.7 23.9" />
    </g>

    <!-- beacon diamond -->
    <path d="M45 31 L59 45 L45 59 L31 45 Z" fill="#ff6d10" />
    <path d="M45 38 L52 45 L45 52 L38 45 Z" fill="#0e1217" />
</svg>
