<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- A 16×16 striped park tent with a pennant, on a lawn. -->
  <rect width="16" height="16" fill="#8cc4e8"/>
  <rect y="12" width="16" height="4" fill="#5c8a2e"/>
  <rect y="12" width="16" height="1" fill="#4a7524"/>
  <!-- pole and pennant -->
  <rect x="7" y="1" width="1" height="4" fill="#2a1d0c"/>
  <rect x="8" y="1" width="3" height="1" fill="#e3c21c"/>
  <rect x="8" y="2" width="2" height="1" fill="#e3c21c"/>
  <!-- roof, red and cream stripes -->
  <rect x="6" y="5" width="3" height="1" fill="#c8312a"/>
  <rect x="5" y="6" width="5" height="1" fill="#f2e6c4"/>
  <rect x="4" y="7" width="7" height="1" fill="#c8312a"/>
  <rect x="3" y="8" width="9" height="1" fill="#f2e6c4"/>
  <rect x="2" y="9" width="11" height="1" fill="#c8312a"/>
  <!-- walls and doorway -->
  <rect x="3" y="10" width="9" height="2" fill="#f2e6c4"/>
  <rect x="3" y="10" width="1" height="2" fill="#c8312a"/>
  <rect x="11" y="10" width="1" height="2" fill="#c8312a"/>
  <rect x="7" y="10" width="2" height="2" fill="#2a1d0c"/>
  <rect x="2" y="12" width="11" height="1" fill="#2a1d0c" opacity=".35"/>
</svg>
