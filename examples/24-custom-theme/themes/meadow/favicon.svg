<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
    <title>odf — meadow theme logo</title>

    <defs>
        <clipPath id="tile">
            <rect x="0" y="0" width="90" height="90" rx="18" />
        </clipPath>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2f76dc" />
            <stop offset="1" stop-color="#9cc8f7" />
        </linearGradient>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7fd04f" />
            <stop offset="1" stop-color="#3f8f24" />
        </linearGradient>
        <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9cc4ff" />
            <stop offset="1" stop-color="#5c95f2" />
        </linearGradient>
        <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6a9cf0" />
            <stop offset="0.45" stop-color="#4f86ea" />
            <stop offset="0.5" stop-color="#2a63d8" />
            <stop offset="1" stop-color="#1f53c2" />
        </linearGradient>
        <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4a7cdc" />
            <stop offset="0.45" stop-color="#3468cc" />
            <stop offset="0.5" stop-color="#1a48a8" />
            <stop offset="1" stop-color="#143c90" />
        </linearGradient>
    </defs>

    <g clip-path="url(#tile)">
        <!-- open sky -->
        <rect x="0" y="0" width="90" height="90" fill="url(#sky)" />

        <!-- a drifting cloud -->
        <ellipse cx="22" cy="18" rx="14" ry="5" fill="#fff" fill-opacity="0.85" />
        <ellipse cx="30" cy="15" rx="9" ry="5" fill="#fff" fill-opacity="0.85" />

        <!-- the rolling green hill -->
        <path d="M-4 62 Q 30 40 94 56 L94 94 L-4 94 Z" fill="url(#hill)" />

        <!-- the cube's shadow on the grass -->
        <ellipse cx="54" cy="71" rx="21" ry="6" fill="#1e5014" fill-opacity="0.35" />
    </g>

    <!-- a glossy cube standing on the hill -->
    <path d="M54 30 L72 40 L54 50 L36 40 Z" fill="url(#top)" stroke="#1f53c2" stroke-width="1" stroke-linejoin="round" />
    <path d="M36 40 L54 50 L54 72 L36 62 Z" fill="url(#left)" stroke="#1f53c2" stroke-width="1" stroke-linejoin="round" />
    <path d="M72 40 L54 50 L54 72 L72 62 Z" fill="url(#right)" stroke="#143c90" stroke-width="1" stroke-linejoin="round" />
</svg>
