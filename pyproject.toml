[project]
name = "odf"
version = "0.3.0"
description = "Open Data Framework CLI."
authors = [
    {name = "mykytapavlov",email = "mykytapavlov@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer (>=0.27.0,<0.28.0)",
    "rich (>=15.0.0,<16.0.0)",
    "opendataframework (>=0.4.0,<0.5.0)"
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
mcp = [
    "mcp>=1.2.0,<2.0.0",
]
chat = [
    "ollama>=0.4.0",
]
notebook = [
    "notebook (>=7.6.0,<8.0.0)",
    "websockets (>=13.0)",
]
examples = [
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "plotly (>=5.24.0,<6.0.0)",
    "notebook (>=7.6.0,<8.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "websockets (>=13.0)",
]

[project.scripts]
odf = "odf.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "fastapi (>=0.100.0)",
    "httpx2 (>=0.28.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "mcp (>=1.2.0,<2.0.0)",
    "notebook (>=7.6.0,<8.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "ollama (>=0.4.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "plotly (>=5.24.0,<6.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "uvicorn (>=0.23.0)",
    "pytest-timeout (>=2.4.0,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "websockets (>=13.0)",
]
docs = [
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "termynal (>=0.14.0,<0.15.0)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.bandit]
exclude_dirs = ["tests", "examples"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--timeout=30 --cov=odf --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    # A Service.run() exception is expected to crash its (daemon) background
    # thread — see test_service_run_exception_is_logged. Attribution of this
    # warning to a specific test is timing-dependent since it fires
    # asynchronously, so it's filtered globally rather than per-test.
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["odf"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[[tool.poetry.source]]
name = "local-pypi"
url = "http://localhost:8080/simple/"
priority = "explicit"


[tool.poetry.dependencies]
opendataframework = {source = "local-pypi"}
