# The bakery's odf project. Addresses here are the compose services'; secrets
# (tokens, webhook secrets, the mailbox password) come from the environment,
# which compose.yaml sets from .env. An environment variable overrides any
# value here (see app/settings.py).

[project]
name = "bakery"
# On the bakery-data volume, so the logs and the notification history outlast
# the container (docker compose down, then up), and so do the chat's
# conversations, which would otherwise go with the container's own files.
log-dir = "data/logs"
chat-file = "data/chat.json"

# The demo runs for days: each component's log rotates at 5 MB, keeping 3
# older files. The notification history (every notification, in one file)
# rotates at 20 MB, keeping 5: a café sale is one, so this keeps the notices
# for days despite them.
[project.logging]
max-bytes = 5_000_000
backups = 3
history-max-bytes = 20_000_000
history-backups = 5

[component.sqlite]
path = "data/bakery.db"

[component.clock]
world-url = "http://world:8000"

[component.pos]
url = "http://pos:8001"

[component.messenger]
url = "http://messenger:8002"
phone-number-id = "100200300"

[component.drive]
path = "/shared-drive"

# The world serves an Open-Meteo-style forecast, offline.
[component.weather]
url = "http://world:8000"
lat = 51.454
lon = -2.592

# Replies to emailed order changes, through the demo's mail server.
[component.mail]
host = "mailpit"
port = 1025
address = "orders@bakery.example"

# A local Ollama for the agents. Empty: rules only, and what they can't read
# waits for a person. OLLAMA_URL and OLLAMA_MODEL override (see .env.example).
[component.model]
url = ""
name = "gpt-oss:20b"

# The UI's chat window (odf run --chat), through the host's Ollama. It calls
# the same tools MCP serves: the agents, the functions, the repositories. Its
# model has to call tools: gpt-oss:20b does (ollama pull gpt-oss:20b). Without
# Ollama, the window says it can't reach it; nothing else needs it.
[project.chat]
model = "gpt-oss:20b"
ollama-host = "http://host.docker.internal:11434"
# The bakery's 25 tools take about 12k tokens to describe, more than Ollama's
# default window holds alongside a question.
context-length = 32768

[service.webhook-receiver]
host = "0.0.0.0"
port = 4750

[service.mailbox]
host = "mailpit"
port = 1110
user = "bakery"
interval = 5

[service.shared-drive]
interval = 5

# The bakery's own topology icons (an oven, a bread rack, an invoice...),
# assigned to nodes in layout.json. The path is relative to where odf runs.
[ui]
icon-scripts = ["icons/bakery.js"]

[ui.topology]
config = false
components = [  # all but SQLite
    "clock", "pos", "messenger", "drive", "weather", "mail", "model",
    "drafting", "purchasing", "costing", "renegotiating", "labelling", "allergen-notices",
]
